name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Flake checks (format, lint)
        run: nix flake check
      - name: Evaluate chi system config
        # Full eval catches module/option errors without building the
        # (multi-GB) closure, which would not fit on a hosted runner.
        run: nix eval --raw .#nixosConfigurations.chi.config.system.build.toplevel.drvPath
