name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Flake checks (format, lint)
        run: nix flake check
      - name: Evaluate chi system config
        # Full eval catches module/option errors without building the
        # (multi-GB) closure, which would not fit on a hosted runner.
        run: nix eval --raw .#nixosConfigurations.chi.config.system.build.toplevel.drvPath
